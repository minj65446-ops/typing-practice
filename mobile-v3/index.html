<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>手机缩写打字训练 · MobiType</title>
<style>
  :root { --bg:#0b0f14; --panel:#111823; --panel2:#0e141d; --line:#1f2a37; --text:#e6edf3;
    --muted:#8b949e; --accent:#58a6ff; --ok:#3fb950; --bad:#f85149; --gold:#d29922; --key:#1c2634; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; overscroll-behavior:none; }
  body { display:flex; flex-direction:column; min-height:100dvh; }

  .top { padding:10px 12px 2px; }
  .row1 { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .brand { font-size:15px; font-weight:700; } .brand em { color:var(--accent); font-style:normal; }
  .chips { display:flex; gap:5px; align-items:center; }
  .chips button, .modebar button { background:var(--panel); color:var(--muted); border:1px solid var(--line);
    border-radius:999px; padding:5px 9px; font-size:12px; cursor:pointer; white-space:nowrap; }
  .chips button.on, .modebar button.on { color:var(--accent); border-color:var(--accent); background:rgba(88,166,255,.1); }
  .modebar { display:flex; gap:5px; overflow-x:auto; padding:8px 0 4px; scrollbar-width:none; }
  .modebar::-webkit-scrollbar { display:none; }

  .stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; padding:4px 12px 6px; }
  .stat { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:6px 4px; text-align:center; }
  .stat b { display:block; font-size:17px; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .stat i { font-style:normal; font-size:10px; color:var(--muted); white-space:nowrap; }
  .bar { height:3px; background:var(--line); margin:0 12px; border-radius:99px; overflow:hidden; }
  .bar > div { height:100%; width:100%; background:var(--accent); transition:width .1s linear; }

  .stage { flex:1; display:flex; flex-direction:column; justify-content:center; padding:8px 14px; }
  #target { text-align:center; font-size:clamp(24px,7vw,32px); line-height:1.6; letter-spacing:.5px; word-break:break-word; }
  #target .c { color:var(--muted); } #target .ok { color:var(--ok); }
  #target .bad { color:#ff7b72; background:rgba(248,81,73,.18); border-radius:4px; }
  #target .cur { color:var(--text); border-bottom:2px solid var(--accent); }
  #target.mono { font-family:"JetBrains Mono",Consolas,monospace; word-break:break-all; }

  /* 缩写提示 */
  #abbr { text-align:center; color:var(--accent); font-family:Consolas,monospace; font-size:15px;
    margin-top:6px; letter-spacing:2px; min-height:20px; }

  /* 虚拟键盘 */
  .kb { display:none; flex-direction:column; gap:6px; padding:4px 8px 10px; }
  .kb.show { display:flex; }
  .krow { display:flex; gap:4px; justify-content:center; }
  .krow button {
    flex:1; max-width:46px; height:42px; background:var(--key); color:var(--text);
    border:1px solid var(--line); border-radius:8px; font-size:16px; font-family:Consolas,monospace;
    position:relative; padding:0;
  }
  .krow button:active { background:#2b3a4f; }
  .krow button.press { background:rgba(88,166,255,.25); }
  .krow button.wrong { background:rgba(248,81,73,.35); border-color:var(--bad); }
  .krow button .dot { position:absolute; right:4px; top:4px; width:5px; height:5px; border-radius:50%; background:var(--bad); opacity:.8; display:none; }
  .krow button .dot.show { display:block; }
  .krow .sp { flex:1; max-width:46px; } .krow button.wide { max-width:64px; font-size:13px; }
  #typing { text-align:center; font-family:Consolas,monospace; font-size:20px; min-height:26px; letter-spacing:3px; color:var(--ok); }
  #typing .w { color:#ff7b72; }

  /* 候选词 */
  .cands { display:none; flex-wrap:wrap; gap:8px; justify-content:center; padding:4px 12px; }
  .cands.show { display:flex; }
  .cands button { background:var(--panel); color:var(--text); border:1px solid var(--line);
    border-radius:10px; padding:10px 16px; font-size:17px; }
  .cands button.correct { border-color:var(--ok); color:var(--ok); }
  .cands button.wrongpick { border-color:var(--bad); color:var(--bad); }

  .hint { color:var(--muted); font-size:12px; text-align:center; padding:0 16px 6px; min-height:18px; }
  .foot { padding:8px 12px calc(12px + env(safe-area-inset-bottom)); display:flex; gap:8px; }
  .foot button { flex:1; padding:12px; border-radius:12px; border:1px solid var(--line);
    background:var(--panel); color:var(--text); font-size:15px; font-weight:600; }
  .foot button.primary { background:var(--accent); border-color:var(--accent); color:#04121f; }
  .foot button:active { transform:scale(.99); }

  #hidden { position:fixed; left:0; bottom:0; width:1px; height:1px; opacity:0; border:0; padding:0; color:transparent; background:transparent; }

  .overlay { position:fixed; inset:0; background:rgba(3,6,10,.84); display:none; align-items:center; justify-content:center; padding:18px; z-index:20; }
  .overlay.show { display:flex; }
  .result { width:100%; max-width:400px; background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:18px; }
  .result h2 { margin:0 0 2px; font-size:21px; } .result .grade { font-size:13px; color:var(--gold); margin-bottom:12px; }
  .result .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px; }
  .result .grid div { background:rgba(255,255,255,.03); border:1px solid var(--line); border-radius:10px; padding:8px 10px; }
  .result .grid b { display:block; font-size:20px; } .result .grid i { font-style:normal; font-size:10px; color:var(--muted); }
  .result p { margin:6px 0; font-size:13px; color:var(--muted); line-height:1.6; }
  .result p b { color:var(--bad); } .result p em { color:var(--gold); font-style:normal; }
  .result .btns { display:flex; gap:8px; margin-top:12px; }
  .result .btns button { flex:1; padding:11px; border-radius:10px; border:1px solid var(--line); background:transparent;
    color:var(--text); font-size:14px; font-weight:600; }
  .result .btns button.primary { background:var(--accent); border-color:var(--accent); color:#04121f; }
</style>
</head>
<body>

<div class="top">
  <div class="row1">
    <div class="brand">📱 缩写打字训练<em>.</em></div>
    <div class="chips" id="durs"></div>
  </div>
  <div class="modebar" id="modes"></div>
</div>

<div class="stats">
  <div class="stat"><b id="speed">0</b><i id="speedUnit">字/分</i></div>
  <div class="stat"><b id="acc">100%</b><i>准确率</i></div>
  <div class="stat"><b id="extra">0</b><i id="extraUnit">回退</i></div>
  <div class="stat"><b id="time">30</b><i>秒</i></div>
</div>
<div class="bar"><div id="progress"></div></div>

<div class="stage">
  <div id="target">点「开始」：用你的输入法打缩写</div>
  <div id="abbr"></div>
</div>

<div class="cands" id="cands"></div>
<div class="kb" id="kb">
  <div id="typing"></div>
  <div class="krow" id="kb1"></div>
  <div class="krow" id="kb2"></div>
  <div class="krow" id="kb3"></div>
</div>

<div class="hint" id="hint">26 键 · 双拇指 · 缩写打法：只打首字母，再选候选词</div>

<div class="foot">
  <button id="startBtn" class="primary">开始</button>
  <button id="stopBtn">结束</button>
</div>

<input id="hidden" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">

<div class="overlay" id="overlay">
  <div class="result">
    <h2 id="rTitle">本局结束</h2>
    <div class="grade" id="rGrade"></div>
    <div class="grid">
      <div><b id="rSpeed">0</b><i id="rSpeedUnit">字/分钟</i></div>
      <div><b id="rAcc">0%</b><i>准确率</i></div>
      <div><b id="rCount">0</b><i>完成短语</i></div>
      <div><b id="rExtra">0</b><i id="rExtraUnit">回退次数</i></div>
    </div>
    <p id="rAnalysis"></p>
    <div class="btns">
      <button id="againBtn" class="primary">再来一局</button>
      <button id="weakBtn">专练弱项</button>
    </div>
  </div>
</div>

<script src="../content.js"></script>
<script src="../train.js"></script>
<script>
(function () {
  "use strict";

  const TRAIN = window.TRAIN || { phrases: [], numeric: [] };
  const PHRASES = TRAIN.phrases || [];
  const NUMERIC = TRAIN.numeric || [];
  const ARTICLES = window.PASSAGES || [];

  const MODES = [
    { key: "abbr", label: "缩写实战", unit: "字/分", kind: "ime",
      hint: "用你手机的输入法：只打首字母，选候选词上屏" },
    { key: "vkb", label: "虚拟键盘", unit: "键/分", kind: "vkb",
      hint: "用下方键盘打首字母：练拇指准确率，不经过输入法" },
    { key: "cand", label: "候选挑战", unit: "键/分", kind: "cand",
      hint: "打首字母 → 从候选词里选出正确短语" },
    { key: "num", label: "数字混排", unit: "键/分", kind: "ime",
      hint: "26 键中英数混排：手机号、日期、金额、单号" },
    { key: "article", label: "文章耐力", unit: "字/分", kind: "ime",
      hint: "长文连续输入：练耐力和节奏（用系统输入法）" }
  ];
  const DURATIONS = [30, 60, 90];
  const ROWS = [
    ["q","w","e","r","t","y","u","i","o","p"],
    ["a","s","d","f","g","h","j","k","l"],
    ["z","x","c","v","b","n","m"]
  ];

  const $ = (id) => document.getElementById(id);
  const el = {};
  ["durs","modes","target","abbr","cands","kb","typing","hint","speed","speedUnit","acc","extra","extraUnit",
   "time","progress","startBtn","stopBtn","hidden","overlay","rTitle","rGrade","rSpeed","rSpeedUnit","rAcc",
   "rCount","rExtra","rExtraUnit","rAnalysis","againBtn","weakBtn"].forEach((id) => { el[id] = $(id); });

  const S = {
    running: false, mode: "abbr", duration: 30, remaining: 30,
    target: "", typed: "", phases: [], phaseIdx: 0,
    startAt: 0, elapsed: 0, timer: null,
    correct: 0, totalTyped: 0, correctKeys: 0, totalKeys: 0,
    backspaces: 0, rounds: 0, roundStart: 0,
    roundTimes: [], keyErr: load("mobitype.keyErr", {}),
    keyHit: load("mobitype.keyHit", {}),
    best: load("mobitype.best2", {}),
    current: null,  // 当前短语对象 {t, j}
    phase: "typing", // typing | cand
    candPick: null, candList: [], wrongCands: 0,
    hintOn: true
  };

  function load(k, d) { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function modeDef() { return MODES.find((m) => m.key === S.mode) || MODES[0]; }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

  // ---------- 界面 ----------
  DURATIONS.forEach((d) => {
    const b = document.createElement("button");
    b.textContent = d + "s"; b.dataset.dur = d;
    b.addEventListener("click", () => { if (S.running) return; S.duration = d; S.remaining = d; renderDurs(); updateStats(); });
    el.durs.appendChild(b);
  });
  const hintBtn = document.createElement("button");
  hintBtn.textContent = "提示";
  hintBtn.classList.add("on");
  hintBtn.addEventListener("click", () => {
    S.hintOn = !S.hintOn;
    hintBtn.classList.toggle("on", S.hintOn);
    renderAbbr();
  });
  el.durs.appendChild(hintBtn);
  function renderDurs() { [...el.durs.children].forEach((b) => b.classList.toggle("on", +b.dataset.dur === S.duration)); }

  MODES.forEach((m) => {
    const b = document.createElement("button");
    b.textContent = m.label; b.dataset.mode = m.key;
    b.addEventListener("click", () => {
      S.mode = m.key;
      if (S.running) finish("切换模式");
      renderModes(); updateKeyboardVisibility(); resetRound(true);
    });
    el.modes.appendChild(b);
  });
  function renderModes() {
    [...el.modes.children].forEach((b) => b.classList.toggle("on", b.dataset.mode === S.mode));
    el.speedUnit.textContent = modeDef().unit;
    el.rSpeedUnit.textContent = modeDef().unit.replace("/分", "/分钟");
    el.extraUnit.textContent = modeDef().kind === "ime" ? "回退" : "误击";
    el.rExtraUnit.textContent = modeDef().kind === "ime" ? "回退次数" : "误击次数";
  }
  function updateKeyboardVisibility() {
    const k = modeDef().kind;
    el.kb.classList.toggle("show", k === "vkb" || k === "cand");
    el.target.classList.toggle("mono", false);
  }

  // ---------- 虚拟键盘 ----------
  function buildKeyboard() {
    const holders = [ $("kb1"), $("kb2"), $("kb3") ];
    holders.forEach((h) => { h.innerHTML = ""; });
    ROWS.forEach((row, ri) => {
      row.forEach((ch) => {
        const b = document.createElement("button");
        b.textContent = ch; b.dataset.key = ch;
        b.addEventListener("click", () => tapKey(ch));
        const dot = document.createElement("span");
        dot.className = "dot"; dot.dataset.key = ch;
        b.appendChild(dot);
        holders[ri].appendChild(b);
      });
      if (ri === 2) {
        const bs = document.createElement("button");
        bs.textContent = "⌫"; bs.className = "wide";
        bs.addEventListener("click", () => backspaceKey());
        holders[ri].appendChild(bs);
      }
    });
    refreshKeyDots();
  }
  function refreshKeyDots() {
    document.querySelectorAll("#kb .dot").forEach((d) => {
      const n = S.keyErr[d.dataset.key] || 0;
      d.classList.toggle("show", n >= 2);
    });
  }

  // ---------- 出题 ----------
  function nextPhrase() {
    if (S.mode === "num") {
      S.current = { t: pick(NUMERIC), j: "" };
      return;
    }
    if (S.mode === "article") {
      if (!ARTICLES.length) { S.current = { t: pick(PHRASES).t, j: "" }; return; }
      const p = pick(ARTICLES);
      const clean = p.text.replace(/\s+/g, "");
      const want = 28 + Math.floor(Math.random() * 20);
      const start = Math.floor(Math.random() * Math.max(1, clean.length - want));
      S.current = { t: clean.slice(start, start + want), j: "", title: p.title };
      return;
    }
    S.current = pick(PHRASES);
  }

  function resetRound(first) {
    nextPhrase();
    S.typed = ""; S.phase = "typing"; S.wrongCands = 0;
    el.hidden.value = "";
    el.cands.classList.remove("show");
    el.cands.innerHTML = "";
    S.roundStart = performance.now();
    render();
    renderAbbr();
    renderTyping();
    if (first && modeDef().kind === "ime") focusInput();
    if (first && modeDef().kind !== "ime") { /* 虚拟键盘不需要系统键盘 */ }
  }

  function render() {
    const t = S.current.t, typed = S.typed;
    let html = "";
    for (let i = 0; i < t.length; i++) {
      const ch = t[i] === " " ? " " : esc(t[i]);
      let cls = "c";
      if (i < typed.length) cls = typed[i] === t[i] ? "ok" : "bad";
      else if (i === typed.length && S.phase === "typing") cls = "cur";
      html += '<span class="' + cls + '">' + ch + "</span>";
    }
    el.target.innerHTML = html;
  }
  function esc(s) { return s.replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

  function renderAbbr() {
    const m = modeDef();
    if (!S.current || !S.current.j || !S.hintOn || m.kind === "cand") { el.abbr.textContent = ""; return; }
    el.abbr.textContent = "首字母：" + S.current.j;
  }
  function renderTyping() {
    if (modeDef().kind === "ime") { el.typing.textContent = ""; return; }
    const j = S.current.j || "";
    let html = "";
    for (let i = 0; i < j.length; i++) {
      if (i < S.typed.length) html += '<span class="w">' + esc(j[i]) + "</span>";
      else html += esc(j[i]);
    }
    el.typing.innerHTML = "已打：" + (html || "—");
  }

  function focusInput() { try { el.hidden.focus({ preventScroll: true }); } catch (e) {} }

  // ---------- 统计 ----------
  function minutes() { return Math.max(S.elapsed / 60, 1 / 600); }
  function speed() {
    return modeDef().kind === "ime" ? Math.round(S.correct / minutes()) : Math.round(S.correctKeys / minutes());
  }
  function updateStats() {
    el.speed.textContent = String(speed());
    const total = modeDef().kind === "ime" ? S.totalTyped : S.totalKeys;
    const good = modeDef().kind === "ime" ? S.correct : S.correctKeys;
    el.acc.textContent = (total ? Math.round((good / total) * 100) : 100) + "%";
    el.extra.textContent = String(modeDef().kind === "ime" ? S.backspaces : (S.totalKeys - S.correctKeys));
    el.time.textContent = String(S.duration ? Math.max(0, Math.ceil(S.remaining)) : Math.round(S.elapsed));
    el.progress.style.width = S.duration ? Math.max(0, (S.remaining / S.duration) * 100) + "%" : "100%";
  }

  // ---------- 开始 / 结束 ----------
  function start() {
    if (S.running) return;
    S.running = true;
    Object.assign(S, { elapsed:0, correct:0, totalTyped:0, correctKeys:0, totalKeys:0, backspaces:0,
      rounds:0, roundTimes:[], remaining:S.duration, startAt:performance.now() });
    if (el.overlay.classList.contains("show")) el.overlay.classList.remove("show");
    el.hint.textContent = modeDef().hint;
    resetRound(true);
    updateKeyboardVisibility();
    S.timer = setInterval(tick, 100);
    updateStats();
  }
  function tick() {
    if (!S.running) return;
    S.elapsed = (performance.now() - S.startAt) / 1000;
    if (S.duration) { S.remaining = S.duration - S.elapsed; if (S.remaining <= 0) return finish("时间到"); }
    updateStats();
  }
  function grade() {
    const v = speed();
    const m = modeDef().kind;
    if (m === "ime") {
      if (S.mode === "num") { if (v >= 120) return "S · 神速"; if (v >= 80) return "A · 很快"; if (v >= 45) return "B · 合格"; return "C · 再练练"; }
      if (v >= 45) return "S · 高手"; if (v >= 30) return "A · 很快"; if (v >= 18) return "B · 合格"; return "C · 再练练";
    }
    if (v >= 170) return "S · 神速"; if (v >= 120) return "A · 很快"; if (v >= 80) return "B · 合格"; return "C · 再练练";
  }
  function finish(reason) {
    if (!S.running) return;
    S.running = false; clearInterval(S.timer);
    S.elapsed = (performance.now() - S.startAt) / 1000;
    updateStats();
    const v = speed();
    const total = modeDef().kind === "ime" ? S.totalTyped : S.totalKeys;
    const good = modeDef().kind === "ime" ? S.correct : S.correctKeys;
    el.rTitle.textContent = reason || "本局结束";
    el.rGrade.textContent = grade() + " ｜ 完成 " + S.rounds + " 个短语";
    el.rSpeed.textContent = String(v);
    el.rAcc.textContent = (total ? Math.round((good / total) * 100) : 100) + "%";
    el.rCount.textContent = String(S.rounds);
    el.rExtra.textContent = String(modeDef().kind === "ime" ? S.backspaces : (S.totalKeys - S.correctKeys));

    const parts = [];
    const badKeys = Object.entries(S.keyErr).sort((a,b) => b[1]-a[1]).slice(0, 5);
    if (badKeys.length) parts.push("易错键：" + badKeys.map(([k,n]) => "<b>" + k + "</b>×" + n).join("  "));
    const slow = S.roundTimes.slice().sort((a,b) => b.ms - a.ms).slice(0, 3);
    if (slow.length && slow[0].ms > 1200) parts.push("卡壳短语：" + slow.map((x) => "<em>" + esc(x.t) + "</em> " + (x.ms/1000).toFixed(1) + "s").join(" ｜ "));
    el.rAnalysis.innerHTML = parts.join("<br>") || "没有明显问题，继续保持 👏";

    const key = S.mode;
    if (!S.best[key] || v > S.best[key]) { S.best[key] = v; save("mobitype.best2", S.best); }
    save("mobitype.keyErr", S.keyErr);
    el.overlay.classList.add("show");
    el.hidden.blur();
  }

  // ---------- 完成一轮 ----------
  function roundDone(ok) {
    S.rounds++;
    S.roundTimes.push({ t: S.current.t, ms: performance.now() - S.roundStart });
    if (ok && S.mode === "cand") { /* 候选对 */ }
    setTimeout(() => { if (S.running) resetRound(false); }, ok ? 140 : 620);
  }

  // ---------- IME 模式输入 ----------
  el.hidden.addEventListener("input", (e) => {
    if (e.isComposing) return;
    if (!S.running || modeDef().kind !== "ime") return;
    handleIme(el.hidden.value.replace(/[\u0000-\u001F\u007F]/g, ""));
  });
  function handleIme(val) {
    if (val.length > S.current.t.length) val = val.slice(0, S.current.t.length);
    if (val.length < S.typed.length) { S.backspaces += S.typed.length - val.length; S.typed = val; render(); updateStats(); return; }
    for (let i = S.typed.length; i < val.length; i++) {
      S.totalTyped++;
      if (val[i] === S.current.t[i]) S.correct++;
    }
    S.typed = val; render(); updateStats();
    if (S.typed.length >= S.current.t.length) roundDone(true);
  }

  // ---------- 虚拟键盘输入 ----------
  function tapKey(ch) {
    if (!S.running) return;
    if (modeDef().kind !== "vkb" && modeDef().kind !== "cand") return;
    if (S.phase !== "typing") return;
    const expected = (S.current.j || "")[S.typed.length];
    S.totalKeys++;
    const btn = document.querySelector('#kb button[data-key="' + ch + '"]');
    if (ch === expected) {
      S.correctKeys++; S.typed += ch;
      if (btn) { btn.classList.add("press"); setTimeout(() => btn.classList.remove("press"), 120); }
    } else {
      S.keyErr[expected] = (S.keyErr[expected] || 0) + 1;
      if (btn) { btn.classList.add("wrong"); setTimeout(() => btn.classList.remove("wrong"), 180); }
    }
    renderTyping(); updateStats();
    if (S.typed.length >= (S.current.j || "").length) {
      if (S.mode === "cand") showCandidates();
      else roundDone(true);
    }
  }
  function backspaceKey() {
    if (!S.running || modeDef().kind === "ime") return;
    if (S.typed.length === 0) return;
    S.typed = S.typed.slice(0, -1);
    renderTyping(); updateStats();
  }

  // ---------- 候选挑战 ----------
  function showCandidates() {
    S.phase = "cand";
    const correct = S.current.t;
    const first = S.current.j[0];
    let pool = PHRASES.filter((p) => p.t !== correct && p.j[0] === first);
    if (pool.length < 3) pool = PHRASES.filter((p) => p.t !== correct);
    const decoys = [];
    while (decoys.length < 3 && pool.length) {
      const idx = Math.floor(Math.random() * pool.length);
      const d = pool.splice(idx, 1)[0];
      if (d.t !== correct && !decoys.includes(d.t)) decoys.push(d.t);
    }
    const list = [correct, ...decoys].sort(() => Math.random() - 0.5);
    S.candList = list; S.candPick = correct;
    el.cands.innerHTML = "";
    list.forEach((c) => {
      const b = document.createElement("button");
      b.textContent = c;
      b.addEventListener("click", () => {
        if (S.phase !== "cand") return;
        S.totalKeys++;
        if (c === correct) {
          S.correctKeys++; b.classList.add("correct");
          setTimeout(() => roundDone(true), 200);
        } else {
          b.classList.add("wrongpick");
          S.keyErr["候选"] = (S.keyErr["候选"] || 0) + 1;
          S.phase = "typing"; // 防止连点
          const right = [...el.cands.children].find((x) => x.textContent === correct);
          if (right) right.classList.add("correct");
          setTimeout(() => roundDone(false), 700);
        }
        updateStats();
      });
      el.cands.appendChild(b);
    });
    el.cands.classList.add("show");
    el.typing.textContent = "已打：" + S.typed + " → 选正确的短语";
  }

  // ---------- 按钮 ----------
  el.startBtn.addEventListener("click", () => { start(); if (modeDef().kind === "ime") focusInput(); });
  el.stopBtn.addEventListener("click", () => finish("手动结束"));
  el.againBtn.addEventListener("click", () => { el.overlay.classList.remove("show"); start(); if (modeDef().kind === "ime") focusInput(); });
  el.weakBtn.addEventListener("click", () => {
    el.overlay.classList.remove("show");
    S.mode = "vkb"; renderModes(); updateKeyboardVisibility(); start();
  });
  el.target.addEventListener("click", () => { if (modeDef().kind === "ime") focusInput(); });
  document.addEventListener("visibilitychange", () => { if (document.hidden && S.running) finish("切走页面，本局结束"); });

  // ---------- 初始化 ----------
  const q = new URLSearchParams(location.search).get("mode");
  if (MODES.some((m) => m.key === q)) S.mode = q;
  buildKeyboard();
  renderDurs(); renderModes(); updateKeyboardVisibility();
  el.hint.textContent = modeDef().hint;
  updateStats();
})();
</script>
</body>
</html>
